<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>aWoo 萬聖小鎮</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050914;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}
    a-scene{position:fixed!important;inset:0!important;z-index:1!important}
    #ui{position:fixed;inset:0;z-index:9999;pointer-events:none}
    .top{
      position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;
      display:flex;justify-content:space-between;align-items:center;gap:10px
    }
    .brand,.pill,.sceneBtn{
      background:rgba(5,12,31,.86);border:1px solid rgba(255,255,255,.16);color:#fff;
      box-shadow:0 8px 25px rgba(0,0,0,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)
    }
    .brand{padding:10px 14px;border-radius:16px}
    .brand b{display:block;color:#ffd84d;font-size:16px}
    .brand span{font-size:11px;opacity:.72}
    .pill{border-radius:999px;padding:10px 13px;font-size:12px}
    .bottom{
      position:absolute;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);
      width:min(94%,520px);display:grid;grid-template-columns:1fr 1fr;gap:10px;pointer-events:auto
    }
    .sceneBtn{
      min-height:52px;border-radius:16px;font-size:15px;font-weight:800;cursor:pointer;
      touch-action:manipulation;-webkit-tap-highlight-color:transparent
    }
    .sceneBtn.active{background:#ffd84d;color:#15234b;border-color:#ffd84d}
    #status{
      position:absolute;left:50%;bottom:92px;transform:translateX(-50%);
      background:rgba(5,12,31,.82);color:white;border-radius:999px;padding:9px 14px;
      font-size:13px;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis
    }
    #start{
      position:fixed;inset:0;z-index:20000;display:grid;place-items:center;padding:24px;
      background:linear-gradient(180deg,#07152f,#030711);color:white
    }
    .card{
      width:min(100%,420px);padding:28px 24px;border-radius:26px;text-align:center;
      background:rgba(9,17,42,.92);border:1px solid rgba(255,255,255,.14)
    }
    .card .emoji{font-size:52px}
    .card h1{margin:8px 0;color:#ffd84d}
    .card p{line-height:1.65;opacity:.82;font-size:14px}
    #enter{
      width:100%;height:54px;border:0;border-radius:16px;background:#ffd84d;color:#12214a;
      font-size:17px;font-weight:900;cursor:pointer;touch-action:manipulation
    }
    #loading{
      position:fixed;inset:0;z-index:15000;display:none;place-items:center;
      background:rgba(2,6,18,.58);color:white;font-weight:800
    }
    #loading.show{display:grid}
    @media(max-width:520px){.brand span{display:none}}
  </style>
</head>
<body>

<div id="start">
  <div class="card">
    <div class="emoji">🎃</div>
    <h1>aWoo 萬聖小鎮</h1>
    <p>進入後可用手指拖曳，或轉動手機查看 360° 小鎮。</p>
    <button id="enter" type="button">進入萬聖小鎮</button>
  </div>
</div>

<div id="loading">場景載入中…</div>

<div id="ui">
  <div class="top">
    <div class="brand"><b>aWoo 萬聖小鎮</b><span>Always be here</span></div>
    <div id="sceneName" class="pill">📍 入口廣場</div>
  </div>

  <div id="status">拖曳畫面或轉動手機探索</div>

  <div class="bottom">
    <button id="entranceBtn" type="button" class="sceneBtn active">🏠 入口廣場</button>
    <button id="harbourBtn" type="button" class="sceneBtn">🎃 南瓜港</button>
  </div>
</div>

<a-scene
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  loading-screen="enabled:false"
  renderer="antialias:true;colorManagement:true"
>
  <a-sky
    id="sky"
    src="awoo-halloween-town-01-entrance.png?v=3"
    rotation="0 -90 0">
  </a-sky>

  <a-entity
    id="camera"
    camera
    look-controls="touchEnabled:true;mouseEnabled:true;magicWindowTrackingEnabled:true"
    position="0 1.6 0">
  </a-entity>
</a-scene>

<script>
(function () {
  "use strict";

  const ENTRANCE = "awoo-halloween-town-01-entrance.png";
  const HARBOUR  = "awoo-halloween-town-02-pumpkin-harbour.png";

  const start = document.getElementById("start");
  const enter = document.getElementById("enter");
  const sky = document.getElementById("sky");
  const camera = document.getElementById("camera");
  const loading = document.getElementById("loading");
  const status = document.getElementById("status");
  const sceneName = document.getElementById("sceneName");
  const entranceBtn = document.getElementById("entranceBtn");
  const harbourBtn = document.getElementById("harbourBtn");

  let switchNo = 0;

  function requestOrientationPermission() {
    try {
      if (typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function") {
        return DeviceOrientationEvent.requestPermission().catch(function(){ return "denied"; });
      }
    } catch(e) {}
    return Promise.resolve("not-required");
  }

  function preload(url) {
    return new Promise(function(resolve, reject) {
      const img = new Image();
      img.onload = function(){ resolve(url); };
      img.onerror = reject;
      img.src = url + "?v=3&preload=" + Date.now();
    });
  }

  function setButtons(which) {
    entranceBtn.classList.toggle("active", which === "entrance");
    harbourBtn.classList.toggle("active", which === "harbour");
  }

  async function changeScene(which) {
    const mySwitch = ++switchNo;
    const isEntrance = which === "entrance";
    const file = isEntrance ? ENTRANCE : HARBOUR;
    const label = isEntrance ? "入口廣場" : "南瓜港";

    loading.classList.add("show");
    status.textContent = "正在前往「" + label + "」…";

    try {
      // 先確認圖片本身真的可讀，避免按鈕看似沒反應。
      await preload(file);
      if (mySwitch !== switchNo) return;

      // 直接用檔案 URL 換 a-sky，不再使用 #assetId。
      sky.setAttribute("src", file + "?v=3&t=" + Date.now());
      sky.setAttribute("rotation", "0 -90 0");

      // 重設基本相機朝向。
      camera.setAttribute("rotation", "0 0 0");

      sceneName.textContent = (isEntrance ? "🏠 " : "🎃 ") + label;
      status.textContent = "已抵達「" + label + "」";
      setButtons(which);

      setTimeout(function(){
        if (status.textContent.indexOf("已抵達") === 0) {
          status.textContent = "拖曳畫面或轉動手機探索";
        }
      }, 1800);
    } catch (err) {
      console.error(err);
      status.textContent = "⚠️ 找不到 " + file;
      alert(
        "場景圖片載入失敗：\\n" + file +
        "\\n\\n請確認這張 PNG 和 index.html 放在同一個資料夾，檔名完全一致。"
      );
    } finally {
      if (mySwitch === switchNo) loading.classList.remove("show");
    }
  }

  // 用 pointerup，比 click 在部分手機 WebView 更穩。
  entranceBtn.addEventListener("pointerup", function(e){
    e.preventDefault();
    changeScene("entrance");
  });

  harbourBtn.addEventListener("pointerup", function(e){
    e.preventDefault();
    changeScene("harbour");
  });

  // 桌機鍵盤 / 某些瀏覽器 fallback。
  entranceBtn.addEventListener("click", function(){
    if (!window.PointerEvent) changeScene("entrance");
  });
  harbourBtn.addEventListener("click", function(){
    if (!window.PointerEvent) changeScene("harbour");
  });

  enter.addEventListener("click", async function(){
    await requestOrientationPermission();
    start.style.display = "none";
  });

})();
</script>
</body>
</html>
