<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06132f">
<title>aWoo 萬聖小鎮</title>
<!-- aWoo Halloween build: 20260817-0221 DOM-PANORAMA-NO-WEBGL -->

<style>
:root{
  --navy:#06132f;--yellow:#ffd447;--orange:#ff9e20;--panel:rgba(5,12,32,.86);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#02050d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}
body{touch-action:none;overscroll-behavior:none}
button{font:inherit}

/* panorama */
#viewer{
  position:fixed;inset:0;z-index:1;overflow:hidden;background:#081020;touch-action:none
}
#panoA,#panoB{
  position:absolute;top:0;height:100%;width:auto;max-width:none;user-select:none;-webkit-user-drag:none;
  will-change:transform;pointer-events:none
}
#shade{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.16),transparent 25%,transparent 68%,rgba(0,0,0,.35))
}

/* intro */
#intro{
  position:fixed;inset:0;z-index:5000;display:grid;place-items:center;background:linear-gradient(180deg,#081d43,#02050d)
}
#intro img{width:min(64vw,360px);filter:drop-shadow(0 20px 28px rgba(0,0,0,.38));animation:dogIntro 1.5s ease both}
@keyframes dogIntro{
  0%{opacity:0;transform:translateY(18px) scale(.92)}
  18%{opacity:1;transform:translateY(0) scale(1)}
  35%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}
  65%{transform:rotate(-3deg)}80%{transform:rotate(3deg)}
  100%{transform:rotate(0)}
}
#introText{position:absolute;bottom:40px;font-weight:800;letter-spacing:1px;opacity:.8}

/* welcome */
#welcome{
  position:fixed;inset:0;z-index:4500;display:none;place-items:center;padding:22px;background:rgba(2,7,19,.92)
}
.card{
  width:min(100%,430px);padding:26px 22px;border-radius:28px;text-align:center;background:rgba(8,18,44,.95);
  border:1px solid rgba(255,255,255,.14);box-shadow:0 25px 70px rgba(0,0,0,.4)
}
.card h1{margin:8px 0;color:var(--yellow);font-size:29px}
.card p{line-height:1.7;font-size:14px;opacity:.86}
.primary{width:100%;height:54px;border:0;border-radius:17px;background:linear-gradient(135deg,var(--yellow),#ffad2e);color:#10214a;font-weight:900;font-size:17px}

/* HUD */
#hud{position:fixed;inset:0;z-index:100;pointer-events:none}
.hidden{display:none!important}
.top{
  position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;gap:8px
}
.brand,.hudBtn,#progress,#sceneLabel,#hint,.sceneChip{
  background:var(--panel);border:1px solid rgba(255,255,255,.14);color:#fff;box-shadow:0 8px 25px rgba(0,0,0,.25)
}
.brand{padding:9px 12px;border-radius:15px}
.brand b{display:block;color:var(--yellow);font-size:15px}.brand small{font-size:10px;opacity:.65}
.actions{display:flex;gap:7px;pointer-events:auto}
.hudBtn{width:44px;height:44px;border-radius:14px}
#progress{position:absolute;top:66px;left:50%;transform:translateX(-50%);padding:8px 13px;border-radius:999px;font-size:12px;white-space:nowrap}
#sceneLabel{position:absolute;top:106px;left:50%;transform:translateX(-50%);padding:7px 12px;border-radius:999px;font-size:12px;white-space:nowrap}
#hint{position:absolute;bottom:106px;left:50%;transform:translateX(-50%);padding:8px 13px;border-radius:999px;font-size:12px;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
#sceneNav{
  position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;padding:0 12px 4px;pointer-events:auto;scrollbar-width:none
}
#sceneNav::-webkit-scrollbar{display:none}
.sceneChip{flex:0 0 auto;height:48px;border-radius:15px;padding:0 14px;font-weight:800}
.sceneChip.active{background:var(--yellow);color:#10214a;border-color:var(--yellow)}

/* ghost */
#ghostHotspot{
  position:fixed;z-index:90;width:92px;height:92px;transform:translate(-50%,-50%);border:0;background:transparent;display:none;padding:0;pointer-events:auto;
  filter:drop-shadow(0 10px 16px rgba(0,0,0,.4));animation:float 1.6s ease-in-out infinite alternate
}
#ghostHotspot img{width:100%;height:100%;object-fit:contain}
#ghostHotspot::after{content:"";position:absolute;inset:-7px;border:2px dashed var(--yellow);border-radius:50%}
@keyframes float{to{margin-top:-8px}}

/* modal */
.modal{
  position:fixed;inset:0;z-index:1500;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.62);backdrop-filter:blur(8px)
}
.modal.show{display:flex}
.modalCard{
  width:min(100%,450px);max-height:86vh;overflow:auto;border-radius:24px;background:#0a1838;border:1px solid rgba(255,255,255,.13);padding:20px;text-align:center
}
.modalCard h2{color:var(--yellow);margin:0 0 10px}
.closeBtn{width:100%;height:48px;border:0;border-radius:15px;background:#fff;color:#10214a;font-weight:850;margin-top:12px}
.ghostGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.ghostCard{padding:8px;border-radius:15px;background:rgba(255,255,255,.06);font-size:11px}
.ghostCard img{width:100%;aspect-ratio:1;object-fit:contain;filter:grayscale(1) brightness(.3);opacity:.42}
.ghostCard.caught img{filter:none;opacity:1}

/* capture */
#captureGhost{width:180px;height:180px;object-fit:contain}
.captureActions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.captureActions button{height:48px;border:0;border-radius:14px;font-weight:850}
#photoNow{background:var(--yellow);color:#10214a}
#continueBtn{background:rgba(255,255,255,.1);color:#fff}

/* photo */
#photoPanel{position:fixed;inset:0;z-index:1800;display:none;background:#02050d}
#photoPanel.show{display:block}
#photoBg{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#081020
}
.photoTop{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;z-index:20;display:flex;justify-content:space-between}
.photoTop button{height:44px;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:rgba(5,12,32,.86);color:#fff;padding:0 13px;font-weight:800}
#petWrap{
  position:absolute;z-index:8;left:50%;top:52%;transform:translate(-50%,-50%);width:min(70vw,340px);height:min(54vh,470px);
  border:4px solid #fff;border-radius:28px;overflow:hidden;display:none;background:#111
}
#petPreview{width:100%;height:100%;object-fit:cover}
.mascot{position:absolute;z-index:10;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4))}
#photoDog{left:2%;bottom:8%;width:min(34vw,180px)}
.photoGhost{width:min(22vw,112px)}
.g1{left:1%;top:17%}.g2{right:1%;top:17%}.g3{left:4%;bottom:30%}.g4{right:4%;bottom:30%}.g5{left:29%;top:8%}.g6{right:28%;bottom:8%}
.photoBottom{position:absolute;z-index:30;left:12px;right:12px;bottom:max(16px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:9px}
.photoBottom button{height:52px;border:0;border-radius:15px;font-weight:900}
#pickPet{background:#fff;color:#10214a}#makeStory{background:var(--yellow);color:#10214a}
#petInput{display:none}
#resultCanvas{width:100%;max-height:62vh;object-fit:contain;border-radius:14px;background:#111}
.resultBtns{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.resultBtns button{height:48px;border:0;border-radius:14px;font-weight:850}
#saveResult{background:var(--yellow);color:#10214a}#shareResult{background:#fff;color:#10214a}

/* loader */
#loader{position:fixed;inset:0;z-index:6000;display:none;place-items:center;background:#02050d}
#loader.show{display:grid}
#toast{position:fixed;z-index:7000;left:50%;top:50%;transform:translate(-50%,-50%);background:#07152f;border:1px solid rgba(255,255,255,.16);padding:14px 18px;border-radius:16px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;text-align:center}
#toast.show{opacity:1}
</style>
</head>

<body>

<div id="viewer">
  <img id="panoA" alt="">
  <img id="panoB" alt="">
</div>
<div id="shade"></div>

<audio id="bgm" src="./awoo-halloween-bgm.mp3" loop preload="none"></audio>

<section id="intro">
  <img src="./awoo-halloween-npc.png" alt="aWoo Halloween NPC">
  <div id="introText">aWoo Halloween Adventure</div>
</section>

<section id="welcome">
  <div class="card">
    <div style="font-size:46px">🎃</div>
    <h1>aWoo 萬聖小鎮</h1>
    <p>拖曳畫面或轉動手機探索 7 個區域，<br>找回藏在小鎮裡的 6 隻萌鬼。<br>集滿後解鎖「萌鬼軍團大合照」！</p>
    <button id="enterTown" class="primary">進入萬聖小鎮</button>
  </div>
</section>

<div id="hud" class="hidden">
  <div class="top">
    <div class="brand"><b>aWoo 萬聖小鎮</b><small>Always be here</small></div>
    <div class="actions">
      <button id="albumBtn" class="hudBtn">👻</button>
      <button id="photoBtn" class="hudBtn">📸</button>
      <button id="soundBtn" class="hudBtn">🔊</button>
    </div>
  </div>
  <div id="progress">萌鬼圖鑑　0 / 6</div>
  <div id="sceneLabel">📍 入口廣場</div>
  <div id="hint">👆 左右拖曳畫面探索</div>
  <div id="sceneNav"></div>
</div>

<button id="ghostHotspot"><img id="hotspotImg" alt=""></button>

<div id="albumModal" class="modal"><div class="modalCard">
  <h2>👻 萌鬼圖鑑</h2><div id="ghostGrid" class="ghostGrid"></div>
  <button class="closeBtn" data-close="albumModal">繼續探索</button>
</div></div>

<div id="captureModal" class="modal"><div class="modalCard">
  <img id="captureGhost" alt=""><h2>捕捉成功！</h2><p id="captureName"></p>
  <div class="captureActions"><button id="photoNow">📸 跟牠合照</button><button id="continueBtn">繼續尋找</button></div>
</div></div>

<section id="photoPanel">
  <canvas id="photoBg"></canvas>
  <div class="photoTop"><button id="exitPhoto">← 回小鎮</button><button id="photoSceneName">📍 目前場景</button></div>
  <div id="petWrap"><img id="petPreview" alt=""></div>
  <img id="photoDog" class="mascot" src="./awoo-halloween-npc.png" alt="">
  <img class="mascot photoGhost g1" data-g="0" alt=""><img class="mascot photoGhost g2" data-g="1" alt="">
  <img class="mascot photoGhost g3" data-g="2" alt=""><img class="mascot photoGhost g4" data-g="3" alt="">
  <img class="mascot photoGhost g5" data-g="4" alt=""><img class="mascot photoGhost g6" data-g="5" alt="">
  <div class="photoBottom"><button id="pickPet">🐾 拍／選毛孩照片</button><button id="makeStory">✨ 生成限動合照</button></div>
  <input id="petInput" type="file" accept="image/*" capture="environment">
</section>

<div id="resultModal" class="modal"><div class="modalCard">
  <h2>✨ 萌鬼合照完成</h2><canvas id="resultCanvas" width="1080" height="1920"></canvas>
  <div class="resultBtns"><button id="saveResult">儲存照片</button><button id="shareResult">分享</button></div>
  <button class="closeBtn" data-close="resultModal">返回</button>
</div></div>

<div id="loader">載入場景中…</div>
<div id="toast"></div>

<script>
(() => {
"use strict";

const VERSION="20260817-0221";
const SCENES=[
 {id:"entrance",name:"入口廣場",icon:"🏠",file:"awoo-halloween-town-01-entrance.png"},
 {id:"harbour",name:"南瓜港",icon:"🎃",file:"awoo-halloween-town-02-pumpkin-harbour.png"},
 {id:"witch",name:"魔女雜貨店",icon:"🧙",file:"awoo-halloween-town-03-witch-shop.png"},
 {id:"graveyard",name:"墓園",icon:"🪦",file:"awoo-halloween-town-04-graveyard.png"},
 {id:"station",name:"廢棄車站",icon:"🚂",file:"awoo-halloween-town-05-abandoned-station.png"},
 {id:"candy",name:"糖果屋",icon:"🍭",file:"awoo-halloween-town-06-candy-house.png"},
 {id:"plaza",name:"萌鬼廣場",icon:"👻",file:"awoo-halloween-town-07-ghost-plaza.png"}
];
const GHOSTS=[
 {id:"pumpkin",name:"南瓜怪",file:"awoo-ghost-01-pumpkin.png",scene:"harbour",yaw:.12},
 {id:"batmouse",name:"蝙蝠老鼠",file:"awoo-ghost-02-batmouse.png",scene:"witch",yaw:.62},
 {id:"mummy",name:"木乃伊兔",file:"awoo-ghost-03-mummy-bunny.png",scene:"graveyard",yaw:.33},
 {id:"cat",name:"魔女黑貓",file:"awoo-ghost-04-witch-cat.png",scene:"station",yaw:.78},
 {id:"werewolf",name:"小狼人",file:"awoo-ghost-05-werewolf.png",scene:"candy",yaw:.47},
 {id:"candyghost",name:"糖果幽靈",file:"awoo-ghost-06-candy-ghost.png",scene:"plaza",yaw:.88}
];

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const viewer=$("#viewer"),panoA=$("#panoA"),panoB=$("#panoB"),hud=$("#hud"),intro=$("#intro"),welcome=$("#welcome");
const sceneNav=$("#sceneNav"),sceneLabel=$("#sceneLabel"),progress=$("#progress"),hint=$("#hint");
const ghostHotspot=$("#ghostHotspot"),hotspotImg=$("#hotspotImg"),albumModal=$("#albumModal"),ghostGrid=$("#ghostGrid");
const captureModal=$("#captureModal"),captureGhost=$("#captureGhost"),captureName=$("#captureName");
const photoPanel=$("#photoPanel"),photoBg=$("#photoBg"),photoSceneName=$("#photoSceneName");
const petWrap=$("#petWrap"),petPreview=$("#petPreview"),petInput=$("#petInput");
const resultModal=$("#resultModal"),resultCanvas=$("#resultCanvas"),loader=$("#loader"),toast=$("#toast"),bgm=$("#bgm");

let currentScene=0;
let caught=new Set(JSON.parse(localStorage.getItem("awooCaughtGhosts")||"[]"));
let panoImg=null;
let pan=0; // 0..1
let dragging=false,lastX=0;
let sensorBase=null,sensorOffset=0,sensorEnabled=false;
let petImage=null,soundOn=true;

function url(f){return "./"+f+"?v="+VERSION}
function wrap01(v){v%=1;if(v<0)v+=1;return v}
function showToast(t){toast.textContent=t;toast.classList.add("show");clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove("show"),1600)}
function openM(m){m.classList.add("show")} function closeM(m){m.classList.remove("show")}
$$("[data-close]").forEach(b=>b.onclick=()=>closeM(document.getElementById(b.dataset.close)));

function loadImg(src){
 return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error(src));i.src=url(src)})
}

async function setScene(i){
 loader.classList.add("show");
 try{
   const img=await loadImg(SCENES[i].file);
   currentScene=i;panoImg=img;pan=0;
   panoA.src=img.src;panoB.src=img.src;
   sceneLabel.textContent=`📍 ${SCENES[i].name}`;
   photoSceneName.textContent=`📍 ${SCENES[i].name}`;
   $$(".sceneChip").forEach((b,j)=>b.classList.toggle("active",j===i));
   renderPanorama();
   updateGhost();
 }catch(e){alert("找不到場景圖片："+SCENES[i].file)}
 finally{loader.classList.remove("show")}
}

function renderPanorama(){
 if(!panoImg)return;
 const H=innerHeight;
 const W=panoImg.naturalWidth*(H/panoImg.naturalHeight);
 if(!W)return;
 const x=-(pan*W);
 panoA.style.width=W+"px";panoB.style.width=W+"px";
 panoA.style.height=H+"px";panoB.style.height=H+"px";
 panoA.style.transform=`translate3d(${x}px,0,0)`;
 panoB.style.transform=`translate3d(${x+W}px,0,0)`;

 // if first image entirely left, show an extra copy by moving A after B
 if(x+W<innerWidth){
   panoA.style.transform=`translate3d(${x+W*2}px,0,0)`;
 }
 updateGhost();
}

function buildNav(){
 sceneNav.innerHTML="";
 SCENES.forEach((s,i)=>{
   const b=document.createElement("button");b.className="sceneChip"+(i===0?" active":"");
   b.textContent=`${s.icon} ${s.name}`;b.onclick=()=>setScene(i);sceneNav.appendChild(b);
 });
}

viewer.addEventListener("pointerdown",e=>{dragging=true;lastX=e.clientX});
viewer.addEventListener("pointermove",e=>{
 if(!dragging||!panoImg)return;
 const H=innerHeight,W=panoImg.naturalWidth*(H/panoImg.naturalHeight);
 const dx=e.clientX-lastX;lastX=e.clientX;pan=wrap01(pan-dx/W);renderPanorama()
});
addEventListener("pointerup",()=>dragging=false);addEventListener("pointercancel",()=>dragging=false);

async function enableSensor(){
 try{
   if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){
     const r=await DeviceOrientationEvent.requestPermission();if(r!=="granted")return
   }
   if("DeviceOrientationEvent" in window){
     sensorEnabled=true;
     addEventListener("deviceorientation",e=>{
       if(e.alpha==null)return;
       if(sensorBase==null)sensorBase=e.alpha;
       let d=e.alpha-sensorBase;if(d>180)d-=360;if(d<-180)d+=360;
       sensorOffset=d/360;
       pan=wrap01(sensorOffset);
       renderPanorama();
     },true)
   }
 }catch(_){}
}

function currentGhost(){return GHOSTS.find(g=>g.scene===SCENES[currentScene].id)}
function updateGhost(){
 const g=currentGhost();
 if(!g||caught.has(g.id)||!panoImg){ghostHotspot.style.display="none";return}
 let d=g.yaw-pan;while(d>.5)d-=1;while(d<-.5)d+=1;
 const H=innerHeight,W=panoImg.naturalWidth*(H/panoImg.naturalHeight);
 const visibleFrac=innerWidth/W;
 if(Math.abs(d)>visibleFrac*.52){ghostHotspot.style.display="none";return}
 ghostHotspot.style.left=(50+(d/visibleFrac)*100)+"%";
 ghostHotspot.style.top="52%";
 hotspotImg.src=url(g.file);ghostHotspot.style.display="block";
}

ghostHotspot.onclick=()=>{
 const g=currentGhost();if(!g)return;
 caught.add(g.id);localStorage.setItem("awooCaughtGhosts",JSON.stringify([...caught]));
 updateProgress();renderAlbum();captureGhost.src=url(g.file);captureName.textContent=`「${g.name}」已加入萌鬼圖鑑！`;
 ghostHotspot.style.display="none";openM(captureModal)
};

function updateProgress(){progress.textContent=`萌鬼圖鑑　${caught.size} / 6`}
function renderAlbum(){
 ghostGrid.innerHTML="";
 GHOSTS.forEach(g=>{
  const d=document.createElement("div");d.className="ghostCard"+(caught.has(g.id)?" caught":"");
  d.innerHTML=`<img src="${url(g.file)}"><b>${caught.has(g.id)?g.name:"？？？"}</b>`;
  ghostGrid.appendChild(d)
 })
}
$("#albumBtn").onclick=()=>{renderAlbum();openM(albumModal)};
$("#continueBtn").onclick=()=>closeM(captureModal);
$("#photoNow").onclick=()=>{closeM(captureModal);enterPhoto()};
$("#photoBtn").onclick=enterPhoto;

function drawCurrentView(ctx,w,h){
 if(!panoImg)return;
 const scale=h/panoImg.naturalHeight;
 const panoW=panoImg.naturalWidth*scale;
 const offset=pan*panoW;
 const x=-offset;
 ctx.drawImage(panoImg,x,0,panoW,h);
 ctx.drawImage(panoImg,x+panoW,0,panoW,h);
 if(x+panoW<w)ctx.drawImage(panoImg,x+panoW*2,0,panoW,h)
}

function enterPhoto(){
 photoPanel.classList.add("show");hud.classList.add("hidden");
 photoBg.width=innerWidth*(devicePixelRatio||1);photoBg.height=innerHeight*(devicePixelRatio||1);
 const c=photoBg.getContext("2d");c.setTransform(devicePixelRatio||1,0,0,devicePixelRatio||1,0,0);drawCurrentView(c,innerWidth,innerHeight);
 $$("[data-g]").forEach((im,i)=>{im.src=url(GHOSTS[i].file);im.style.display=caught.has(GHOSTS[i].id)?"block":"none"});
}
$("#exitPhoto").onclick=()=>{photoPanel.classList.remove("show");hud.classList.remove("hidden");updateGhost()};
$("#pickPet").onclick=()=>petInput.click();
petInput.onchange=()=>{
 const f=petInput.files&&petInput.files[0];if(!f)return;
 const i=new Image();i.onload=()=>{petImage=i;petPreview.src=i.src;petWrap.style.display="block"};i.src=URL.createObjectURL(f)
};

function drawCover(ctx,img,x,y,w,h){
 const ir=img.width/img.height,tr=w/h;let sx=0,sy=0,sw=img.width,sh=img.height;
 if(ir>tr){sw=img.height*tr;sx=(img.width-sw)/2}else{sh=img.width/tr;sy=(img.height-sh)/2}
 ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h)
}
async function loadAsset(f){return await loadImg(f)}
$("#makeStory").onclick=async()=>{
 if(!petImage){showToast("先拍／選毛孩照片 🐾");return}
 const ctx=resultCanvas.getContext("2d");ctx.clearRect(0,0,1080,1920);
 drawCurrentView(ctx,1080,1920);
 ctx.fillStyle="rgba(3,10,30,.18)";ctx.fillRect(0,0,1080,1920);
 ctx.save();ctx.beginPath();ctx.roundRect(170,470,740,940,54);ctx.clip();drawCover(ctx,petImage,170,470,740,940);ctx.restore();
 ctx.strokeStyle="#fff";ctx.lineWidth=10;ctx.beginPath();ctx.roundRect(170,470,740,940,54);ctx.stroke();
 ctx.textAlign="center";ctx.fillStyle="#FFD447";ctx.font="900 60px system-ui";ctx.fillText(caught.size===6?"aWoo 萌鬼軍團大合照":"aWoo 萌鬼合照",540,125);
 ctx.fillStyle="#fff";ctx.font="600 30px system-ui";ctx.fillText(SCENES[currentScene].name+" · Halloween 2026",540,175);
 const dog=await loadAsset("awoo-halloween-npc.png");ctx.drawImage(dog,20,1270,350,520);
 const pos=[[20,220],[830,220],[20,950],[835,950],[230,210],[760,1480]];
 for(let i=0;i<GHOSTS.length;i++)if(caught.has(GHOSTS[i].id)){const im=await loadAsset(GHOSTS[i].file);ctx.drawImage(im,pos[i][0],pos[i][1],220,240)}
 ctx.textAlign="right";ctx.font="800 28px system-ui";ctx.fillText("aWoo · Always be here",1020,1870);
 openM(resultModal)
};
$("#saveResult").onclick=()=>{const a=document.createElement("a");a.download="awoo-halloween-photo.png";a.href=resultCanvas.toDataURL("image/png");a.click()};
$("#shareResult").onclick=async()=>{
 const blob=await new Promise(r=>resultCanvas.toBlob(r,"image/png"));
 const file=new File([blob],"awoo-halloween-photo.png",{type:"image/png"});
 if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file]});else showToast("請先儲存照片")
};

$("#soundBtn").onclick=async()=>{
 soundOn=!soundOn;$("#soundBtn").textContent=soundOn?"🔊":"🔇";
 if(soundOn){try{await bgm.play()}catch(_){showToast("尚未放入 BGM")}}else bgm.pause()
};

$("#enterTown").onclick=async()=>{
 await enableSensor();welcome.style.display="none";hud.classList.remove("hidden");
 try{bgm.volume=.45;await bgm.play()}catch(_){soundOn=false;$("#soundBtn").textContent="🔇"}
};

addEventListener("resize",renderPanorama);

async function start(){
 buildNav();renderAlbum();updateProgress();await setScene(0);
 setTimeout(()=>{
   intro.style.opacity="0";intro.style.transition="opacity .35s";
   setTimeout(()=>{intro.style.display="none";welcome.style.display="grid"},350)
 },1700)
}
start();

})();
</script>
</body>
