<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>aWoo 萬聖小鎮</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050914;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}
    #ui{position:fixed;inset:0;z-index:9999;pointer-events:none}
    .top{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
    .brand,.pill,.sceneBtn{background:rgba(5,12,31,.88);border:1px solid rgba(255,255,255,.16);color:#fff;box-shadow:0 8px 25px rgba(0,0,0,.28)}
    .brand{padding:10px 14px;border-radius:16px}.brand b{display:block;color:#ffd84d;font-size:16px}.brand span{font-size:11px;opacity:.72}
    .pill{border-radius:999px;padding:10px 13px;font-size:12px}
    .bottom{position:absolute;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(94%,520px);display:grid;grid-template-columns:1fr 1fr;gap:10px;pointer-events:auto}
    .sceneBtn{min-height:52px;border-radius:16px;font-size:15px;font-weight:800;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    .sceneBtn.active{background:#ffd84d;color:#15234b;border-color:#ffd84d}
    #status{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:rgba(5,12,31,.84);color:#fff;border-radius:999px;padding:9px 14px;font-size:13px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
    #start{position:fixed;inset:0;z-index:20000;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#07152f,#030711);color:white}
    .card{width:min(100%,420px);padding:28px 24px;border-radius:26px;text-align:center;background:rgba(9,17,42,.94);border:1px solid rgba(255,255,255,.14)}
    .card .emoji{font-size:52px}.card h1{margin:8px 0;color:#ffd84d}.card p{line-height:1.65;opacity:.82;font-size:14px}
    #enter{width:100%;height:54px;border:0;border-radius:16px;background:#ffd84d;color:#12214a;font-size:17px;font-weight:900;cursor:pointer}
    #debug{position:fixed;top:70px;left:14px;z-index:10000;background:rgba(0,0,0,.65);color:#fff;padding:7px 10px;border-radius:10px;font-size:11px;display:none}
  </style>
</head>
<body>

<div id="start">
  <div class="card">
    <div class="emoji">🎃</div>
    <h1>aWoo 萬聖小鎮</h1>
    <p>用手指拖曳，或轉動手機探索 360° 場景。</p>
    <button id="enter" type="button">進入萬聖小鎮</button>
  </div>
</div>

<div id="ui">
  <div class="top">
    <div class="brand"><b>aWoo 萬聖小鎮</b><span>Always be here</span></div>
    <div id="sceneName" class="pill">🏠 入口廣場</div>
  </div>
  <div id="status">拖曳畫面或轉動手機探索</div>
  <div class="bottom">
    <button id="entranceBtn" class="sceneBtn active" type="button">🏠 入口廣場</button>
    <button id="harbourBtn" class="sceneBtn" type="button">🎃 南瓜港</button>
  </div>
</div>

<div id="debug"></div>

<a-scene
  id="scene"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  loading-screen="enabled:false"
  renderer="antialias:true;colorManagement:true"
>
  <!-- 單一球體，材質由 Three.js 直接替換 -->
  <a-entity
    id="panoSphere"
    geometry="primitive:sphere;radius:50;segmentsWidth:64;segmentsHeight:40"
    material="shader:flat;side:back"
    scale="-1 1 1">
  </a-entity>

  <a-entity
    id="camera"
    camera
    look-controls="touchEnabled:true;mouseEnabled:true;magicWindowTrackingEnabled:true"
    position="0 0 0">
  </a-entity>
</a-scene>

<script>
(function(){
  "use strict";

  const FILES = {
    entrance: "awoo-halloween-town-01-entrance.png",
    harbour: "awoo-halloween-town-02-pumpkin-harbour.png"
  };

  const start = document.getElementById("start");
  const enter = document.getElementById("enter");
  const sphere = document.getElementById("panoSphere");
  const scene = document.getElementById("scene");
  const entranceBtn = document.getElementById("entranceBtn");
  const harbourBtn = document.getElementById("harbourBtn");
  const sceneName = document.getElementById("sceneName");
  const status = document.getElementById("status");
  const debug = document.getElementById("debug");

  let textures = {};
  let ready = false;

  function setStatus(text){ status.textContent = text; }

  function loadTexture(url){
    return new Promise(function(resolve,reject){
      const loader = new THREE.TextureLoader();
      loader.load(
        url + "?v=6",
        function(tex){
          tex.colorSpace = THREE.SRGBColorSpace || tex.colorSpace;
          tex.wrapS = THREE.ClampToEdgeWrapping;
          tex.wrapT = THREE.ClampToEdgeWrapping;
          tex.needsUpdate = true;
          resolve(tex);
        },
        undefined,
        reject
      );
    });
  }

  function applyTexture(tex){
    const mesh = sphere.getObject3D("mesh");
    if (!mesh || !mesh.material) throw new Error("360 sphere mesh not ready");

    mesh.material.map = tex;
    mesh.material.color.set(0xffffff);
    mesh.material.needsUpdate = true;
    mesh.visible = true;
  }

  async function prepare(){
    if (ready) return;
    setStatus("正在載入入口與南瓜港…");

    try{
      const results = await Promise.all([
        loadTexture(FILES.entrance),
        loadTexture(FILES.harbour)
      ]);

      textures.entrance = results[0];
      textures.harbour = results[1];

      applyTexture(textures.entrance);
      ready = true;
      setStatus("拖曳畫面或轉動手機探索");
    }catch(err){
      console.error(err);
      alert(
        "360° 圖片載入失敗。請確認這兩個檔案與 index.html 在同一層：\\n\\n" +
        FILES.entrance + "\\n" + FILES.harbour
      );
      setStatus("圖片載入失敗");
    }
  }

  function switchScene(which){
    if (!ready || !textures[which]){
      setStatus("場景還在載入");
      return;
    }

    try{
      applyTexture(textures[which]);

      const isEntrance = which === "entrance";
      entranceBtn.classList.toggle("active", isEntrance);
      harbourBtn.classList.toggle("active", !isEntrance);
      sceneName.textContent = isEntrance ? "🏠 入口廣場" : "🎃 南瓜港";
      setStatus(isEntrance ? "已切換：入口廣場" : "已切換：南瓜港");

      // 強制要求 Three.js 重畫一幀
      if (scene.renderer && scene.object3D && scene.camera) {
        scene.renderer.render(scene.object3D, scene.camera);
      }

      setTimeout(function(){
        setStatus("拖曳畫面或轉動手機探索");
      }, 1200);

    }catch(err){
      console.error(err);
      debug.style.display = "block";
      debug.textContent = "切換失敗：" + err.message;
      setStatus("場景切換失敗");
    }
  }

  entranceBtn.addEventListener("click", function(e){
    e.preventDefault();
    switchScene("entrance");
  });

  harbourBtn.addEventListener("click", function(e){
    e.preventDefault();
    switchScene("harbour");
  });

  enter.addEventListener("click", async function(){
    try{
      if (typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function"){
        await DeviceOrientationEvent.requestPermission();
      }
    }catch(e){}
    start.style.display = "none";
  });

  if (scene.hasLoaded) {
    prepare();
  } else {
    scene.addEventListener("loaded", prepare, {once:true});
  }
})();
</script>
</body>
</html>
