<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>aWoo 萬聖小鎮</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050914;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}
    #ui{position:fixed;inset:0;z-index:9999;pointer-events:none}
    .top{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
    .brand,.pill,.sceneBtn{background:rgba(5,12,31,.86);border:1px solid rgba(255,255,255,.16);color:#fff;box-shadow:0 8px 25px rgba(0,0,0,.28)}
    .brand{padding:10px 14px;border-radius:16px}
    .brand b{display:block;color:#ffd84d;font-size:16px}
    .brand span{font-size:11px;opacity:.72}
    .pill{border-radius:999px;padding:10px 13px;font-size:12px}
    .bottom{position:absolute;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(94%,520px);display:grid;grid-template-columns:1fr 1fr;gap:10px;pointer-events:auto}
    .sceneBtn{min-height:52px;border-radius:16px;font-size:15px;font-weight:800;cursor:pointer;touch-action:manipulation}
    .sceneBtn.active{background:#ffd84d;color:#15234b;border-color:#ffd84d}
    #status{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:rgba(5,12,31,.82);color:white;border-radius:999px;padding:9px 14px;font-size:13px;white-space:nowrap}
    #start{position:fixed;inset:0;z-index:20000;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#07152f,#030711);color:white}
    .card{width:min(100%,420px);padding:28px 24px;border-radius:26px;text-align:center;background:rgba(9,17,42,.92);border:1px solid rgba(255,255,255,.14)}
    .card .emoji{font-size:52px}.card h1{margin:8px 0;color:#ffd84d}.card p{line-height:1.65;opacity:.82;font-size:14px}
    #enter{width:100%;height:54px;border:0;border-radius:16px;background:#ffd84d;color:#12214a;font-size:17px;font-weight:900;cursor:pointer}
  </style>
</head>
<body>

<div id="start">
  <div class="card">
    <div class="emoji">🎃</div>
    <h1>aWoo 萬聖小鎮</h1>
    <p>進入後可用手指拖曳，或轉動手機探索 360° 場景。</p>
    <button id="enter" type="button">進入萬聖小鎮</button>
  </div>
</div>

<div id="ui">
  <div class="top">
    <div class="brand"><b>aWoo 萬聖小鎮</b><span>Always be here</span></div>
    <div id="sceneName" class="pill">🏠 入口廣場</div>
  </div>
  <div id="status">拖曳畫面或轉動手機探索</div>
  <div class="bottom">
    <button id="entranceBtn" class="sceneBtn active" type="button">🏠 入口廣場</button>
    <button id="harbourBtn" class="sceneBtn" type="button">🎃 南瓜港</button>
  </div>
</div>

<a-scene
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  loading-screen="enabled:false"
>
  <a-assets timeout="20000">
    <img id="entranceImg" src="awoo-halloween-town-01-entrance.png">
    <img id="harbourImg" src="awoo-halloween-town-02-pumpkin-harbour.png">
  </a-assets>

  <!-- 兩個獨立天空，切換顯示/隱藏 -->
  <a-sky id="entranceSky" src="#entranceImg" rotation="0 -90 0" visible="true"></a-sky>
  <a-sky id="harbourSky" src="#harbourImg" rotation="0 -90 0" visible="false"></a-sky>

  <a-entity
    id="camera"
    camera
    look-controls="touchEnabled:true;mouseEnabled:true;magicWindowTrackingEnabled:true"
    position="0 1.6 0">
  </a-entity>
</a-scene>

<script>
(function(){
  const start = document.getElementById("start");
  const enter = document.getElementById("enter");
  const entranceSky = document.getElementById("entranceSky");
  const harbourSky = document.getElementById("harbourSky");
  const entranceBtn = document.getElementById("entranceBtn");
  const harbourBtn = document.getElementById("harbourBtn");
  const sceneName = document.getElementById("sceneName");
  const status = document.getElementById("status");

  function setScene(scene){
    const isEntrance = scene === "entrance";

    entranceSky.setAttribute("visible", isEntrance);
    harbourSky.setAttribute("visible", !isEntrance);

    entranceBtn.classList.toggle("active", isEntrance);
    harbourBtn.classList.toggle("active", !isEntrance);

    sceneName.textContent = isEntrance ? "🏠 入口廣場" : "🎃 南瓜港";
    status.textContent = isEntrance ? "已抵達「入口廣場」" : "已抵達「南瓜港」";

    setTimeout(() => {
      status.textContent = "拖曳畫面或轉動手機探索";
    }, 1500);
  }

  entranceBtn.addEventListener("click", () => setScene("entrance"));
  harbourBtn.addEventListener("click", () => setScene("harbour"));

  enter.addEventListener("click", async () => {
    try {
      if (typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function") {
        await DeviceOrientationEvent.requestPermission();
      }
    } catch(e) {}
    start.style.display = "none";
  });

  // 額外檢查第二張圖是否真的載入成功
  const harbourImg = document.getElementById("harbourImg");
  harbourImg.addEventListener("error", () => {
    alert("找不到南瓜港圖片：awoo-halloween-town-02-pumpkin-harbour.png");
  });
})();
</script>

</body>
</html>
